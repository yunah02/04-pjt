{% extends "base.html" %}
{% block content %}
  <h1 class="page-title">도서 수정</h1>
  <form action="{% url 'books:update' book.pk %}" method="POST">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn-ink">수정하기</button>
    <a href="{% url 'books:detail' book.pk %}" class="btn-line">취소</a>
  </form>
{% endblock %}
