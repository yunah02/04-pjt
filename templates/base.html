
{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>복북</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <div></div>

      <a class="brand" href="{% url 'books:index' %}">
        복북
      </a>

      <nav class="header-right">
        {% if user.is_authenticated %}
          <span>{{ user.username }}님</span>
        {% endif %}

        {% comment %}
        팀원 accounts 머지 후 아래 블록을 주석에서 풀 것
        {% if user.is_authenticated %}
          <a href="{% url 'accounts:update' %}">회원정보 수정</a>
          <a href="{% url 'accounts:change_password' %}">비밀번호 변경</a>
          <form action="{% url 'accounts:logout' %}" method="POST" style="display:inline;">
            {% csrf_token %}
            <button>로그아웃</button>
          </form>
          <form action="{% url 'accounts:delete' %}" method="POST" style="display:inline;">
            {% csrf_token %}
            <button>회원탈퇴</button>
          </form>
        {% else %}
          <a href="{% url 'accounts:login' %}">로그인</a>
          <a href="{% url 'accounts:signup' %}">회원가입</a>
        {% endif %}
        {% endcomment %}
      </nav>
    </div>
  </header>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
