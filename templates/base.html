<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도서 커뮤니티</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-primary mb-4" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'books:index' %}">BookStory</a>
      <ul class="navbar-nav ms-auto flex-row gap-3 align-items-center">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'books:index' %}">도서 목록</a>
        </li>
        {% if request.user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'books:create' %}">도서 등록</a>
          </li>
          <li class="nav-item">
            <span class="navbar-text">{{ user.username }}님</span>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'accounts:update' %}">회원정보수정</a>
          </li>
          <li class="nav-item">
            <form action="{% url 'accounts:delete' %}" method="POST"
                  onsubmit="return confirm('정말 탈퇴하시겠습니까?');">
              {% csrf_token %}
              <button type="submit" class="btn btn-link nav-link">회원탈퇴</button>
            </form>
          </li>
          <li class="nav-item">
            <form action="{% url 'accounts:logout' %}" method="POST">
              {% csrf_token %}
              <button type="submit" class="btn btn-link nav-link">로그아웃</button>
            </form>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'accounts:login' %}">로그인</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'accounts:signup' %}">회원가입</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </nav>

  <div class="container">
    {% block content %}
    {% endblock content %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
