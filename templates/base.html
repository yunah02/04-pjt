{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>복북</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <div></div>

      <a class="brand" href="{% url 'books:index' %}">복북</a>

      <nav class="header-right">
        <a href="{% url 'books:index' %}">도서 목록</a>

        {% if request.user.is_authenticated %}
          <a href="{% url 'books:create' %}">도서 등록</a>
          <a href="{% url 'accounts:profile' user.username %}">{{ user.username }}님</a>
          <a href="{% url 'accounts:update' %}">회원정보수정</a>
          <a href="{% url 'accounts:change_password' %}">비밀번호 변경</a>
          <form action="{% url 'accounts:delete' %}" method="POST" class="d-inline"
                onsubmit="return confirm('정말 탈퇴하시겠습니까?');">
            {% csrf_token %}
            <button type="submit" class="btn btn-link p-0">회원탈퇴</button>
          </form>
          <form action="{% url 'accounts:logout' %}" method="POST" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-link p-0">로그아웃</button>
          </form>
        {% else %}
          <a href="{% url 'accounts:login' %}">로그인</a>
          <a href="{% url 'accounts:signup' %}">회원가입</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
